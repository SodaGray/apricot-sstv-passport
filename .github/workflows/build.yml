# SPDX-License-Identifier: GPL-3.0-only
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build with ESP-IDF 5.5.3
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.3
          target: esp32c3
          command: idf.py build && idf.py merge-bin -o apricot-sstv-passport-full.bin
      - name: Keep the firmware
        uses: actions/upload-artifact@v4
        with:
          name: apricot-sstv-passport-firmware
          path: |
            build/apricot-sstv-passport-full.bin
            build/apricot-sstv-passport.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flasher_args.json

  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Decoder bench and app simulation (ASan/UBSan)
        working-directory: host
        run: make test
